name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-check:
    name: make check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run project checks
        run: make check

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1

      - name: Check shell formatting
        run: shfmt -d -i 2 -ci -sr install.sh bin/vpsbuddy lib/vpsbuddy.sh lib/templates/vpsbuddy-audit-prelude.sh lib/templates/vpsbuddy-auth.sh tests/run.sh

  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check GitHub Markdown and YAML formatting
        run: npx --yes prettier@3.3.3 --check "**/*.{md,yml,yaml,json}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
